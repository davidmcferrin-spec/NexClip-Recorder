<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NexCLIP Recorder — Settings</title>
<link rel="stylesheet" href="/assets/nexrec.css">
<script src="/assets/nexrec-ui.js"></script>
</head>
<body>
<nav class="topnav">
  <a class="brand" href="/live">NexCLIP Recorder</a>
  <a href="/live">Live</a>
  <a href="/export">Export</a>
  <a href="/inputs" data-auth-role="admin,operator">Inputs</a>
  <a class="active" href="/settings" data-auth-role="admin,operator">Settings</a>
  <a href="/users" data-auth-role="admin">Users</a>
  <a href="/services" data-auth-role="admin">Services</a>
  <button type="button" class="theme-toggle" id="theme-toggle">Light</button>
  <span class="nav-version" id="nav-version" hidden></span>
  <span class="nav-who" id="nav-who" hidden></span>
  <button type="button" class="nav-logout" id="nav-logout">Log out</button>
</nav>
<main>
  <div class="panel">
    <h1>Station</h1>
    <p class="sub">Values come from nexrec.env (written by setup.sh / an admin). This page is read-only in v0 so a web request cannot rewrite systemd env.</p>
    <table><tbody id="rows"></tbody></table>
  </div>
  <div class="panel">
    <h1>Status</h1>
    <pre class="meta" id="status" style="white-space:pre-wrap"></pre>
  </div>
</main>
<script src="/assets/nexrec-auth-gate.js"></script>
<script>
NexRecAuth.requirePage({ roles: ["admin", "operator"] }).then(function () {
  return Promise.all([NexRecAuth.recApi("settings_get"), NexRecAuth.recApi("status")]);
}).then(function (all) {
  var tb = document.getElementById("rows");
  var s = all[0].settings || {};
  Object.keys(s).forEach(function (k) {
    var tr = document.createElement("tr");
    tr.innerHTML = "<th>" + k + "</th><td>" + (s[k] || "—") + "</td>";
    tb.appendChild(tr);
  });
  document.getElementById("status").textContent = JSON.stringify(all[1], null, 2);
});
</script>
</body>
</html>
