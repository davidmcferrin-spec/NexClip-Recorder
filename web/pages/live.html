<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NexCLIP Recorder — Live</title>
<link rel="stylesheet" href="/assets/nexrec.css">
<script src="/assets/nexrec-ui.js"></script>
</head>
<body>
<nav class="topnav">
  <a class="brand" href="/live">NexCLIP Recorder</a>
  <a class="active" href="/live">Live</a>
  <a href="/export">Export</a>
  <a href="/inputs" data-auth-role="admin,operator">Inputs</a>
  <a href="/settings" data-auth-role="admin,operator">Setup</a>
  <a href="/users" data-auth-role="admin">Users</a>
  <a href="/services" data-auth-role="admin">Services</a>
  <button type="button" class="theme-toggle" id="theme-toggle">Light</button>
  <span class="nav-version" id="nav-version" hidden></span>
  <span class="nav-who" id="nav-who" hidden></span>
  <button type="button" class="nav-logout" id="nav-logout">Log out</button>
</nav>
<main>
  <div class="bar">
    <span class="meta">Layout</span>
    <div class="seg" id="layout-seg">
      <button type="button" data-n="1">1</button>
      <button type="button" data-n="2">2</button>
      <button type="button" data-n="3">3</button>
      <button type="button" data-n="4" class="active">4</button>
      <button type="button" data-n="6">6</button>
    </div>
    <span class="meta">Monitors</span>
    <div class="seg" id="monitor-seg" title="Confidence scopes on the selected pane, from the decoded WHEP preview. Default off, saved in this browser. Not burned into the record. The RTA is 64 bands on the stereo listen pair — 64-channel SDI/AES embed metering is NEXT.">
      <button type="button" data-mon="scopes" aria-pressed="false">Scopes</button>
      <button type="button" data-mon="vu" aria-pressed="false">VU</button>
      <button type="button" data-mon="rta" aria-pressed="false">RTA</button>
    </div>
    <span class="meta" id="clock">—</span>
    <span class="meta" id="monitor-hint">Confidence monitors follow the selected pane (decoded preview, not the record). Stereo AAC proxy.</span>
  </div>
  <div class="grid n4" id="grid"></div>
</main>
<script src="/assets/nexrec-scopes.js"></script>
<script src="/assets/nexrec-vu.js"></script>
<script src="/assets/nexrec-spectrum.js"></script>
<script src="/assets/nexrec-auth-gate.js"></script>
<script>
(function () {
  var n = 4;
  var inputs = [];
  var selected = 0;
  var monitors = null;
  var clockTimers = [];
  NexRecAuth.requirePage().then(load);
  syncToggles();

  function syncToggles() {
    var map = {
      scopes: window.NexRecScopes && NexRecScopes.getOnPref(),
      vu: window.NexRecVu && NexRecVu.getVisiblePref(),
      rta: window.NexRecSpectrum && NexRecSpectrum.getOnPref()
    };
    document.querySelectorAll("#monitor-seg button[data-mon]").forEach(function (btn) {
      var on = !!map[btn.getAttribute("data-mon")];
      btn.classList.toggle("active", on);
      btn.setAttribute("aria-pressed", on ? "true" : "false");
    });
  }

  function destroyMonitors() {
    if (!monitors) return;
    try { monitors.spectrum.destroy(); } catch (e) {}
    try { monitors.vu.detach(); } catch (e) {}
    try { monitors.scopes.destroy(); } catch (e) {}
    monitors = null;
  }

  function bindMonitors() {
    destroyMonitors();
    var pane = document.querySelector("#grid .pane.selected");
    if (!pane || !window.NexRecScopes || !window.NexRecVu || !window.NexRecSpectrum) return;
    var video = pane.querySelector("video");
    if (!video) return;
    var vu = NexRecVu.attach({
      container: pane,
      video: video,
      floatable: true,
      stream: video.srcObject || null
    });
    var scopes = NexRecScopes.attach({ container: pane, video: video });
    var spectrum = NexRecSpectrum.attach({ container: pane, vu: vu });
    monitors = { vu: vu, scopes: scopes, spectrum: spectrum, video: video };
    function syncStream() {
      if (!monitors || monitors.video !== video) return;
      if (video.srcObject) vu.setStream(video.srcObject);
    }
    video.addEventListener("loadedmetadata", syncStream);
    video.addEventListener("canplay", syncStream);
    video.addEventListener("playing", syncStream);
    syncStream();
    syncToggles();
  }

  function clearClockTimers() {
    clockTimers.forEach(function (id) { clearInterval(id); });
    clockTimers = [];
  }

  function load() {
    return NexRecAuth.recApi("inputs_list").then(function (data) {
      inputs = data.inputs || [];
      render();
    });
  }

  function render() {
    if (selected >= n) selected = 0;
    clearClockTimers();
    destroyMonitors();
    var grid = document.getElementById("grid");
    grid.className = "grid n" + n;
    grid.innerHTML = "";
    var slots = inputs.slice(0, n);
    while (slots.length < n) slots.push(null);
    slots.forEach(function (inp, i) {
      var pane = document.createElement("div");
      pane.className = "pane" + (i === selected ? " selected" : "");
      pane.setAttribute("data-slot", String(i));
      var tag = document.createElement("div");
      tag.className = "tag";
      tag.textContent = inp ? inp.name : ("empty " + (i + 1));
      if (inp && inp.feat_monitors) tag.textContent += " · mon";
      var clock = document.createElement("div");
      clock.className = "clock";
      clock.textContent = "—";
      var video = document.createElement("video");
      video.autoplay = true;
      video.muted = true;
      video.playsInline = true;
      var ph = document.createElement("div");
      ph.className = "ph";
      ph.innerHTML = inp
        ? '<span class="rec-dot"></span><span>' + (inp.preview_path || "in0") + ' WHEP</span><span>proxy preview</span>'
        : "<span>no input</span>";
      pane.appendChild(video);
      pane.appendChild(ph);
      pane.appendChild(tag);
      pane.appendChild(clock);
      pane.addEventListener("click", function () {
        if (selected === i) return;
        selected = i;
        document.querySelectorAll("#grid .pane").forEach(function (p, idx) {
          p.classList.toggle("selected", idx === selected);
        });
        bindMonitors();
      });
      grid.appendChild(pane);
      if (inp && inp.preview_path) {
        NexRecAuth.whepConnect(video, inp.preview_path).then(function () {
          if (video.srcObject) ph.style.display = "none";
          if (monitors && monitors.video === video && video.srcObject) {
            monitors.vu.setStream(video.srcObject);
          }
        });
      }
      clockTimers.push(setInterval(function () {
        clock.textContent = new Date().toISOString().substr(11, 8) + "Z";
      }, 250));
    });
    bindMonitors();
  }

  document.getElementById("layout-seg").addEventListener("click", function (ev) {
    var btn = ev.target.closest("button[data-n]");
    if (!btn) return;
    n = parseInt(btn.getAttribute("data-n"), 10);
    document.querySelectorAll("#layout-seg button").forEach(function (b) {
      b.classList.toggle("active", b === btn);
    });
    render();
  });

  document.getElementById("monitor-seg").addEventListener("click", function (ev) {
    var btn = ev.target.closest("button[data-mon]");
    if (!btn) return;
    var which = btn.getAttribute("data-mon");
    if (which === "scopes" && window.NexRecScopes) {
      var onS = monitors && monitors.scopes ? !monitors.scopes.isVisible() : !NexRecScopes.getOnPref();
      if (monitors && monitors.scopes) monitors.scopes.setVisible(onS);
      else NexRecScopes.setOnPref(onS);
    } else if (which === "vu" && window.NexRecVu) {
      var onV = monitors && monitors.vu ? !monitors.vu.getVisible() : !NexRecVu.getVisiblePref();
      if (monitors && monitors.vu) monitors.vu.setVisible(onV);
      else NexRecVu.setVisiblePref(onV);
    } else if (which === "rta" && window.NexRecSpectrum) {
      var onR = monitors && monitors.spectrum ? !monitors.spectrum.isVisible() : !NexRecSpectrum.getOnPref();
      if (monitors && monitors.spectrum) monitors.spectrum.setVisible(onR);
      else NexRecSpectrum.setOnPref(onR);
    }
    syncToggles();
  });

  setInterval(function () {
    document.getElementById("clock").textContent = new Date().toISOString();
  }, 500);
})();
</script>
</body>
</html>
