<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NexCLIP Recorder — Live</title>
<link rel="stylesheet" href="/assets/nexrec.css">
<script src="/assets/nexrec-ui.js"></script>
</head>
<body class="stage-page">
<nav class="topnav">
  <a class="brand" href="/live">NexCLIP Recorder</a>
  <a class="active" href="/live">Live</a>
  <a href="/export">Export</a>
  <a href="/transfers" data-auth-role="admin,operator">Transfers</a>
  <a href="/asruns">As-run</a>
  <a href="/metrics" data-auth-role="admin,operator">Metrics</a>
  <a href="/inputs" data-auth-role="admin,operator">Inputs</a>
  <a href="/settings" data-auth-role="admin,operator">Setup</a>
  <a href="/users" data-auth-role="admin">Users</a>
  <a href="/services" data-auth-role="admin">Services</a>
  <button type="button" class="theme-toggle" id="theme-toggle">Light</button>
  <span class="nav-version" id="nav-version" hidden></span>
  <span class="nav-who" id="nav-who" hidden></span>
  <button type="button" class="nav-logout" id="nav-logout">Log out</button>
</nav>
<main>
  <div class="bar">
    <span class="meta">Layout</span>
    <div class="seg" id="layout-seg">
      <button type="button" data-n="1" class="active">1</button>
      <button type="button" data-n="2">2</button>
      <button type="button" data-n="3">3</button>
      <button type="button" data-n="4">4</button>
      <button type="button" data-n="6">6</button>
    </div>
    <span class="meta">Monitors</span>
    <div class="seg" id="monitor-seg" title="Confidence scopes on the selected pane, from the decoded WHEP preview. Default off, saved in this browser. Not burned into the record. The RTA is 64 bands on the stereo listen pair — 64-channel SDI/AES embed metering is NEXT.">
      <button type="button" data-mon="scopes" aria-pressed="false">Scopes</button>
      <button type="button" data-mon="vu" aria-pressed="false">VU</button>
      <button type="button" data-mon="rta" aria-pressed="false">RTA</button>
    </div>
    <span class="meta">Audio</span>
    <button type="button" class="tgl" id="listen-toggle" aria-pressed="false" title="Play the selected pane's preview in this browser. The picture stays muted.">Listen</button>
    <button type="button" class="tgl" id="cc-toggle" aria-pressed="false" title="Draw 608/708 captions on the selected pane (C). Text comes from the recording after the chunk is indexed, so live words trail the picture.">CC</button>
    <input type="range" id="listen-vol" class="listen-vol" min="0" max="1" step="0.05" value="0.2" aria-label="Preview listen volume">
    <span class="meta">View</span>
    <div class="seg" id="view-seg" title="Frameless full window, browser fullscreen, or Picture-in-Picture for the whole multiview. Panes keep their native aspect ratio.">
      <button type="button" data-view="window" aria-pressed="false" title="Hide chrome; fill the browser window (W)">Window</button>
      <button type="button" data-view="full" aria-pressed="false" title="Browser fullscreen (F)">Full</button>
      <button type="button" data-view="pip" aria-pressed="false" title="Picture-in-Picture for the multiview (P)">PiP</button>
    </div>
    <span class="meta" id="clock">—</span>
    <span class="meta" id="monitor-hint">Confidence monitors follow the selected pane (decoded preview, not the record). Stereo Opus proxy.</span>
  </div>
  <div class="stage-pip-home" id="stage-home" hidden>
    <span>Live multiview is in Picture-in-Picture.</span>
    <button type="button" id="stage-pip-return">Return here</button>
  </div>
  <div class="stage" id="stage">
    <div class="grid n1" id="grid"></div>
    <div class="stage-exit" id="stage-exit" hidden>
      <button type="button" id="stage-exit-btn" title="Exit frameless view (Esc)">Exit</button>
    </div>
  </div>
</main>
<script src="/assets/nexrec-scopes.js"></script>
<script src="/assets/nexrec-vu.js"></script>
<script src="/assets/nexrec-spectrum.js"></script>
<script src="/assets/nexrec-cc.js"></script>
<script src="/assets/nexrec-auth-gate.js"></script>
<script>
(function () {
  var n = 1;
  var inputs = [];
  var selected = 0;
  var slotIds = null;
  var SLOT_KEY = "nexrec-live-slots";
  var monitors = null;
  var clockTimers = [];
  var ccBox = null;
  var ccTimer = null;
  var ccFetch = 0;
  var theater = false;
  var pipWindow = null;
  var stageParent = null;
  NexRecAuth.requirePage().then(load);
  syncToggles();
  syncListen();
  syncCcButton();
  syncViewButtons();

  function listeningNow() {
    if (monitors && monitors.vu) return monitors.vu.isListening();
    return window.NexRecVu ? !NexRecVu.getMutedPref() : false;
  }

  function syncListen() {
    var btn = document.getElementById("listen-toggle");
    var vol = document.getElementById("listen-vol");
    var on = listeningNow();
    if (btn) {
      btn.textContent = on ? "Mute" : "Listen";
      btn.classList.toggle("active", on);
      btn.setAttribute("aria-pressed", on ? "true" : "false");
    }
    if (vol && window.NexRecVu && document.activeElement !== vol) {
      vol.value = String(NexRecVu.getVolumePref());
    }
  }

  function syncToggles() {
    var map = {
      scopes: window.NexRecScopes && NexRecScopes.getOnPref(),
      vu: window.NexRecVu && NexRecVu.getVisiblePref(),
      rta: window.NexRecSpectrum && NexRecSpectrum.getOnPref()
    };
    document.querySelectorAll("#monitor-seg button[data-mon]").forEach(function (btn) {
      var on = !!map[btn.getAttribute("data-mon")];
      btn.classList.toggle("active", on);
      btn.setAttribute("aria-pressed", on ? "true" : "false");
    });
  }

  function isoSec(ms) {
    return new Date(ms).toISOString().replace(/\.\d{3}Z$/, "Z");
  }

  function selectedLiveInput() {
    var id = visibleIds()[selected];
    if (!id) return null;
    for (var i = 0; i < inputs.length; i++) {
      if (String(inputs[i].id) === String(id)) return inputs[i];
    }
    return null;
  }

  function syncCcButton() {
    var btn = document.getElementById("cc-toggle");
    if (!btn) return;
    var on = ccBox ? ccBox.isVisible() : (window.NexRecCc && NexRecCc.getOnPref());
    btn.classList.toggle("active", !!on);
    btn.setAttribute("aria-pressed", on ? "true" : "false");
  }

  function destroyCc() {
    if (ccTimer) {
      clearInterval(ccTimer);
      ccTimer = null;
    }
    if (ccBox) {
      try { ccBox.destroy(); } catch (e) {}
      ccBox = null;
    }
  }

  function pullCc() {
    if (!ccBox || !ccBox.isVisible()) return;
    var inp = selectedLiveInput();
    if (!inp) {
      ccBox.setCues([]);
      return;
    }
    var now = Date.now();
    var token = ++ccFetch;
    NexRecAuth.recApi("captions_window", {
      input_id: inp.id,
      t_from: isoSec(now - 15 * 60 * 1000),
      t_to: isoSec(now + 1000)
    }).then(function (data) {
      if (token !== ccFetch || !ccBox) return;
      ccBox.setCues(data.cues || []);
      ccBox.setTime(Date.now());
    }).catch(function () {
      if (token !== ccFetch || !ccBox) return;
      ccBox.setCues([]);
    });
  }

  function startCcPoll() {
    if (ccTimer) clearInterval(ccTimer);
    pullCc();
    ccTimer = setInterval(pullCc, 2000);
  }

  function bindCc() {
    destroyCc();
    if (!window.NexRecCc) return;
    var pane = liveRoot().querySelector("#grid .pane.selected");
    if (!pane) return;
    ccBox = NexRecCc.attach({ container: pane });
    ccBox.setVisible(NexRecCc.getOnPref());
    syncCcButton();
    if (ccBox.isVisible()) startCcPoll();
  }

  function destroyMonitors() {
    if (!monitors) return;
    try { monitors.spectrum.destroy(); } catch (e) {}
    try { monitors.vu.detach(); } catch (e) {}
    try { monitors.scopes.destroy(); } catch (e) {}
    monitors = null;
  }

  function bindMonitors() {
    destroyMonitors();
    var pane = liveRoot().querySelector("#grid .pane.selected");
    if (!pane || !window.NexRecScopes || !window.NexRecVu || !window.NexRecSpectrum) {
      syncListen();
      return;
    }
    var video = pane.querySelector("video");
    if (!video) return;
    var vu = NexRecVu.attach({
      container: pane,
      video: video,
      floatable: true,
      stream: video.srcObject || null
    });
    var scopes = NexRecScopes.attach({ container: pane, video: video });
    var spectrum = NexRecSpectrum.attach({ container: pane, vu: vu });
    monitors = { vu: vu, scopes: scopes, spectrum: spectrum, video: video };
    function syncStream() {
      if (!monitors || monitors.video !== video) return;
      if (video.srcObject) vu.setStream(video.srcObject);
    }
    video.addEventListener("loadedmetadata", syncStream);
    video.addEventListener("canplay", syncStream);
    video.addEventListener("playing", syncStream);
    video.addEventListener("nexrec-whep-track", syncStream);
    syncStream();
    syncToggles();
    syncListen();
  }

  function clearClockTimers() {
    clockTimers.forEach(function (id) { clearInterval(id); });
    clockTimers = [];
  }

  function load() {
    return NexRecAuth.recApi("inputs_list").then(function (data) {
      inputs = data.inputs || [];
      if (slotIds == null) slotIds = NexRecUI.readPaneSlots(localStorage, SLOT_KEY);
      render();
    });
  }

  function visibleIds() {
    return NexRecUI.paneSlotIds(inputs, slotIds);
  }

  function liveRoot() {
    return gridHostDoc();
  }

  function choosePane(i) {
    if (selected === i) return;
    selected = i;
    liveRoot().querySelectorAll("#grid .pane").forEach(function (p, idx) {
      p.classList.toggle("selected", idx === selected);
    });
    bindMonitors();
    bindCc();
  }

  function assignPane(i, inputId) {
    slotIds = NexRecUI.paneAssign(visibleIds(), i, inputId);
    NexRecUI.writePaneSlots(localStorage, SLOT_KEY, slotIds);
    selected = i;
    render();
  }

  function closeAllWhep() {
    liveRoot().querySelectorAll("#grid video").forEach(function (video) {
      if (NexRecAuth.whepClose) NexRecAuth.whepClose(video);
    });
  }

  function paintPlaceholder(ph, inp, state) {
    if (!ph) return;
    if (!inp) {
      ph.innerHTML = "<span>no input</span>";
      ph.style.display = "";
      return;
    }
    var path = inp.preview_path || "in0";
    if (state === "reconnecting" || state === "connecting") {
      ph.innerHTML = '<span class="rec-dot"></span><span>' + path + " WHEP</span><span>reconnecting…</span>";
      ph.style.display = "";
      return;
    }
    ph.innerHTML = '<span class="rec-dot"></span><span>' + path + " WHEP</span><span>proxy preview</span>";
  }

  function hidePlaceholderIfReady(video, ph) {
    var stream = video.srcObject;
    if (stream && stream.getVideoTracks && stream.getVideoTracks().length) {
      ph.style.display = "none";
      return true;
    }
    return false;
  }

  function gridHostDoc() {
    return pipWindow && !pipWindow.closed ? pipWindow.document : document;
  }

  function stageEl() {
    var doc = gridHostDoc();
    return doc.getElementById("stage") || document.getElementById("stage");
  }

  function isFullscreen() {
    var stage = stageEl();
    var fs = document.fullscreenElement || document.webkitFullscreenElement;
    return !!(fs && stage && (fs === stage || stage.contains(fs)));
  }

  function syncViewButtons() {
    var fs = isFullscreen();
    var pip = !!(pipWindow && !pipWindow.closed);
    var videoPip = !!document.pictureInPictureElement;
    document.querySelectorAll("#view-seg button[data-view]").forEach(function (btn) {
      var mode = btn.getAttribute("data-view");
      var on = (mode === "window" && theater && !fs && !pip) ||
        (mode === "full" && fs) ||
        (mode === "pip" && (pip || videoPip));
      btn.classList.toggle("active", on);
      btn.setAttribute("aria-pressed", on ? "true" : "false");
    });
    var stage = stageEl();
    var exit = stage ? stage.querySelector("#stage-exit") : null;
    if (exit) exit.hidden = !(theater || fs) || pip;
    document.body.classList.toggle("live-theater", theater && !pip);
    document.body.classList.toggle("live-pip", pip);
    var home = document.getElementById("stage-home");
    if (home) home.hidden = !pip;
  }

  function setTheater(on) {
    theater = !!on;
    syncViewButtons();
  }

  function exitFullscreen() {
    var leave = document.exitFullscreen || document.webkitExitFullscreen;
    if (leave && (document.fullscreenElement || document.webkitFullscreenElement)) {
      try { leave.call(document); } catch (e) {}
    }
  }

  function enterFullscreen() {
    var stage = stageEl();
    if (!stage) return Promise.resolve();
    var req = stage.requestFullscreen || stage.webkitRequestFullscreen;
    if (!req) return Promise.resolve();
    return Promise.resolve(req.call(stage)).catch(function () {});
  }

  function restoreStageFromPip() {
    var stage = stageEl();
    var parent = stageParent || document.querySelector("main");
    if (stage && parent && stage.parentNode !== parent) {
      parent.appendChild(stage);
    }
    try { if (pipWindow && !pipWindow.closed) pipWindow.close(); } catch (e) {}
    pipWindow = null;
    stageParent = null;
    syncViewButtons();
    bindMonitors();
    bindCc();
  }

  function copyStylesTo(targetDoc) {
    Array.prototype.forEach.call(document.querySelectorAll('link[rel="stylesheet"], style'), function (node) {
      targetDoc.head.appendChild(node.cloneNode(true));
    });
  }

  function enterPip() {
    if (pipWindow && !pipWindow.closed) {
      try { pipWindow.focus(); } catch (e) {}
      return Promise.resolve();
    }
    var stage = stageEl();
    if (!stage) return Promise.resolve();
    // Prefer document PiP so 2–6 panes stay together. Fall back to selected video PiP.
    if (window.documentPictureInPicture && documentPictureInPicture.requestWindow) {
      return documentPictureInPicture.requestWindow({
        width: Math.max(480, Math.round(window.innerWidth * 0.45)),
        height: Math.max(270, Math.round(window.innerHeight * 0.45)),
      }).then(function (win) {
        pipWindow = win;
        copyStylesTo(win.document);
        win.document.documentElement.setAttribute("data-theme", document.documentElement.getAttribute("data-theme") || "dark");
        win.document.body.className = "stage-page live-theater live-pip-window";
        stageParent = stage.parentNode;
        win.document.body.appendChild(stage);
        win.addEventListener("pagehide", function () {
          restoreStageFromPip();
        });
        win.addEventListener("keydown", function (ev) {
          if (ev.key === "Escape") {
            ev.preventDefault();
            exitStageModes();
          }
        });
        syncViewButtons();
        bindMonitors();
        bindCc();
      }).catch(function () {
        return enterVideoPip();
      });
    }
    return enterVideoPip();
  }

  function enterVideoPip() {
    var root = liveRoot();
    var pane = root.querySelector("#grid .pane.selected") || root.querySelector("#grid .pane");
    var video = pane && pane.querySelector("video");
    if (!video || !document.pictureInPictureEnabled || !video.requestPictureInPicture) {
      return Promise.resolve();
    }
    return video.requestPictureInPicture().then(function () {
      syncViewButtons();
    }).catch(function () {});
  }

  function exitPip() {
    if (pipWindow && !pipWindow.closed) {
      restoreStageFromPip();
      return;
    }
    if (document.pictureInPictureElement) {
      try { document.exitPictureInPicture(); } catch (e) {}
    }
  }

  function exitStageModes() {
    setTheater(false);
    exitFullscreen();
    exitPip();
    syncViewButtons();
  }

  function render() {
    if (selected >= n) selected = 0;
    clearClockTimers();
    destroyMonitors();
    destroyCc();
    closeAllWhep();
    var grid = gridHostDoc().getElementById("grid") || document.getElementById("grid");
    grid.className = "grid n" + n;
    grid.innerHTML = "";
    var ids = visibleIds();
    var slots = NexRecUI.paneInputs(inputs, ids, n);
    slots.forEach(function (inp, i) {
      var pane = document.createElement("div");
      pane.className = "pane" + (i === selected ? " selected" : "");
      pane.setAttribute("data-slot", String(i));
      var pick = document.createElement("div");
      pick.className = "pick";
      var sel = document.createElement("select");
      sel.setAttribute("aria-label", "Input for pane " + (i + 1));
      var blank = document.createElement("option");
      blank.value = "";
      blank.textContent = "No input";
      sel.appendChild(blank);
      inputs.forEach(function (row) {
        var opt = document.createElement("option");
        opt.value = String(row.id);
        opt.textContent = row.name || row.id;
        sel.appendChild(opt);
      });
      sel.value = ids[i] || "";
      sel.addEventListener("mousedown", function () { choosePane(i); });
      sel.addEventListener("change", function () { assignPane(i, sel.value); });
      pick.appendChild(sel);
      if (inp && inp.feat_monitors) {
        var mon = document.createElement("span");
        mon.className = "mon";
        mon.textContent = "mon";
        pick.appendChild(mon);
      }
      var clock = document.createElement("div");
      clock.className = "clock";
      clock.textContent = "—";
      var video = document.createElement("video");
      video.autoplay = true;
      video.muted = true;
      video.playsInline = true;
      var ph = document.createElement("div");
      ph.className = "ph";
      paintPlaceholder(ph, inp, "idle");
      pane.appendChild(video);
      pane.appendChild(ph);
      pane.appendChild(pick);
      pane.appendChild(clock);
      pane.addEventListener("click", function () { choosePane(i); });
      var cell = document.createElement("div");
      cell.className = "slot";
      cell.appendChild(pane);
      grid.appendChild(cell);
      if (inp && inp.preview_path) {
        video.addEventListener("nexrec-whep-track", function () {
          hidePlaceholderIfReady(video, ph);
        });
        video.addEventListener("nexrec-whep-state", function (ev) {
          var state = ev && ev.detail && ev.detail.state;
          if (state === "connected" || state === "track") {
            hidePlaceholderIfReady(video, ph);
            if (monitors && monitors.video === video && video.srcObject) {
              monitors.vu.setStream(video.srcObject);
            }
            return;
          }
          if (state === "reconnecting" || state === "connecting") {
            paintPlaceholder(ph, inp, state);
          }
        });
        NexRecAuth.whepConnect(video, inp.preview_path).then(function () {
          hidePlaceholderIfReady(video, ph);
          if (monitors && monitors.video === video && video.srcObject) {
            monitors.vu.setStream(video.srcObject);
          }
        });
      }
      clockTimers.push(setInterval(function () {
        clock.textContent = NexRecUI.formatStation(new Date());
      }, 250));
    });
    bindMonitors();
    bindCc();
  }

  document.getElementById("layout-seg").addEventListener("click", function (ev) {
    var btn = ev.target.closest("button[data-n]");
    if (!btn) return;
    n = parseInt(btn.getAttribute("data-n"), 10);
    document.querySelectorAll("#layout-seg button").forEach(function (b) {
      b.classList.toggle("active", b === btn);
    });
    render();
  });

  document.getElementById("view-seg").addEventListener("click", function (ev) {
    var btn = ev.target.closest("button[data-view]");
    if (!btn) return;
    var mode = btn.getAttribute("data-view");
    if (mode === "window") {
      if (theater && !isFullscreen()) setTheater(false);
      else {
        exitFullscreen();
        exitPip();
        setTheater(true);
      }
    } else if (mode === "full") {
      if (isFullscreen()) exitFullscreen();
      else {
        setTheater(true);
        enterFullscreen();
      }
    } else if (mode === "pip") {
      if (pipWindow && !pipWindow.closed) exitPip();
      else if (document.pictureInPictureElement) exitPip();
      else {
        setTheater(true);
        enterPip();
      }
    }
    syncViewButtons();
  });

  document.getElementById("stage-exit-btn").addEventListener("click", function () {
    exitStageModes();
  });
  document.getElementById("stage-pip-return").addEventListener("click", function () {
    exitPip();
  });
  document.addEventListener("fullscreenchange", syncViewButtons);
  document.addEventListener("webkitfullscreenchange", syncViewButtons);
  document.addEventListener("leavepictureinpicture", syncViewButtons);

  document.getElementById("monitor-seg").addEventListener("click", function (ev) {
    var btn = ev.target.closest("button[data-mon]");
    if (!btn) return;
    var which = btn.getAttribute("data-mon");
    if (which === "scopes" && window.NexRecScopes) {
      var onS = monitors && monitors.scopes ? !monitors.scopes.isVisible() : !NexRecScopes.getOnPref();
      if (monitors && monitors.scopes) monitors.scopes.setVisible(onS);
      else NexRecScopes.setOnPref(onS);
    } else if (which === "vu" && window.NexRecVu) {
      var onV = monitors && monitors.vu ? !monitors.vu.getVisible() : !NexRecVu.getVisiblePref();
      if (monitors && monitors.vu) monitors.vu.setVisible(onV);
      else NexRecVu.setVisiblePref(onV);
    } else if (which === "rta" && window.NexRecSpectrum) {
      var onR = monitors && monitors.spectrum ? !monitors.spectrum.isVisible() : !NexRecSpectrum.getOnPref();
      if (monitors && monitors.spectrum) monitors.spectrum.setVisible(onR);
      else NexRecSpectrum.setOnPref(onR);
    }
    syncToggles();
  });

  document.getElementById("listen-toggle").addEventListener("click", function () {
    var next = !listeningNow();
    if (monitors && monitors.vu) monitors.vu.setListen(next);
    else if (window.NexRecVu) {
      NexRecVu.setMutedPref(!next);
      if (next) NexRecVu.resume();
    }
    syncListen();
  });

  document.getElementById("cc-toggle").addEventListener("click", function () {
    if (!ccBox) bindCc();
    if (!ccBox) return;
    ccBox.setVisible(!ccBox.isVisible());
    if (ccBox.isVisible()) startCcPoll();
    else if (ccTimer) {
      clearInterval(ccTimer);
      ccTimer = null;
    }
    syncCcButton();
  });

  document.addEventListener("keydown", function (ev) {
    if (ev.metaKey || ev.ctrlKey || ev.altKey || ev.repeat) return;
    var el = ev.target;
    if (el && (el.tagName === "TEXTAREA" || el.tagName === "SELECT" || el.isContentEditable)) return;
    if (el && el.tagName === "INPUT") {
      var type = (el.type || "text").toLowerCase();
      if (type !== "range" && type !== "button" && type !== "checkbox" && type !== "radio") return;
    }
    var key = ev.key;
    if (key === "Escape") {
      if (theater || isFullscreen() || (pipWindow && !pipWindow.closed) || document.pictureInPictureElement) {
        ev.preventDefault();
        exitStageModes();
      }
      return;
    }
    if (key === "c" || key === "C") {
      ev.preventDefault();
      document.getElementById("cc-toggle").click();
      return;
    }
    if (key === "w" || key === "W") {
      ev.preventDefault();
      document.querySelector('#view-seg button[data-view="window"]').click();
      return;
    }
    if (key === "f" || key === "F") {
      ev.preventDefault();
      document.querySelector('#view-seg button[data-view="full"]').click();
      return;
    }
    if (key === "p" || key === "P") {
      ev.preventDefault();
      document.querySelector('#view-seg button[data-view="pip"]').click();
    }
  }, true);

  document.getElementById("listen-vol").addEventListener("input", function (ev) {
    var v = Number(ev.target.value);
    if (monitors && monitors.vu) monitors.vu.setVolume(v);
    else if (window.NexRecVu) NexRecVu.setVolumePref(v);
  });

  setInterval(function () {
    document.getElementById("clock").textContent = NexRecUI.formatStation(new Date(), true);
  }, 500);
})();
</script>
</body>
</html>
